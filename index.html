<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>세화 스쿼시 실시간 랭킹 시스템</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #3182ce; --bg: #f7fafc; --card: #ffffff; --text: #2d3748; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        .card { background: var(--card); border-radius: 15px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .rank-item { display: flex; align-items: center; padding: 12px; border-bottom: 1px solid #edf2f7; cursor: pointer; }
        .rank-number { width: 35px; font-weight: bold; color: var(--primary); font-size: 18px; }
        .player-info { flex: 1; margin-left: 10px; }
        .player-name { font-weight: 600; font-size: 16px; display: block; }
        .player-tier { font-size: 11px; color: #718096; }
        .player-stats { text-align: right; font-size: 13px; color: #718096; }
        
        .input-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        select, input { padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; width: 100%; box-sizing: border-box; }
        button { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 5px; }

        #modalOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); display:none; justify-content:center; align-items:center; z-index:1000; }
        .modal { background: white; width: 90%; max-width: 420px; border-radius: 20px; padding: 25px; max-height: 90vh; overflow-y: auto; }
        .badge { font-size: 11px; padding: 4px 10px; border-radius: 12px; background: #fff5f5; border: 1px solid #feb2b2; color: #c53030; margin-right: 5px; margin-bottom: 5px; display: inline-block; }
        .mention-box { background: #f8fafc; padding: 15px; border-radius: 12px; margin: 15px 0; border-left: 4px solid var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align: center; color: var(--primary);">🏸 SEWHA RANKING</h2>

    <div class="card">
        <div class="input-group">
            <select id="challengerSelect"><option value="">도전자</option></select>
            <select id="defenderSelect"><option value="">방어자</option></select>
        </div>
        <div class="input-group">
            <input type="text" id="scoreInput" placeholder="스코어 (ex. 2:1)">
            <select id="resSelect"><option value="승">도전자 승</option><option value="패">도전자 패</option></select>
        </div>
        <button onclick="battleRecord()">경기 결과 저장</button>
    </div>

    <div class="card" id="rankList"></div>
</div>

<div id="modalOverlay" onclick="this.style.display='none'">
    <div class="modal" onclick="event.stopPropagation()">
        <div id="modalBody"></div>
        <canvas id="rankChart" style="margin-top:20px;"></canvas>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { /* 사용자님의 설정값을 입력하세요 */ };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let players = [];
    let myChart = null;

    // [시스템] 티어 기준
    const TIERS = [
        { name: '💎 다이아', min: 2000 }, { name: '🏆 플래티넘', min: 1000 },
        { name: '🥇 골드', min: 500 }, { name: '🥈 실버', min: 200 }, { name: '🥉 브론즈', min: 0 }
    ];
    const getTier = (p = 0) => TIERS.find(t => p >= t.min).name;

    // [로직 복구 1] 업적 분석 함수
    const getAchievements = (p) => {
        const ach = [];
        const games = p.recentGames || [];
        if (games.length >= 10) ach.push("🏅 베테랑 (10회 이상)");
        if (games.slice(0,3).every(g => g.res === '승')) ach.push("🔥 3연승 중");
        if (games.filter(g => g.res === '승').length >= 5) ach.push("⭐ 승률 제조기");
        return ach;
    };

    // [로직 복구 2] 상성 및 멘트 생성
    const getAnalysis = (p) => {
        const games = p.recentGames || [];
        if (games.length === 0) return ["데이터가 쌓이면 분석을 시작합니다!"];
        const winRate = Math.round((games.filter(g => g.res === '승').length / games.length) * 100);
        
        let mentions = [`현재 승률 ${winRate}%로 달리는 중!`];
        const lastGame = games[0];
        if (lastGame.res === '승') mentions.push(`직전 경기에서 ${lastGame.opp}님을 꺾고 기세가 좋습니다.`);
        return mentions;
    };

    // 데이터 감시
    onSnapshot(query(collection(db, "ranking"), orderBy("groupRank", "asc")), (snap) => {
        players = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        const list = document.getElementById("rankList");
        list.innerHTML = players.map(p => `
            <div class="rank-item" onclick="showLog('${p.id}')">
                <div class="rank-number">${p.groupRank}</div>
                <div class="player-info">
                    <span class="player-name">${p.name} <small style="color:#3182ce">${getTier(p.points || 0)}</small></span>
                    <span class="player-tier">${p.points || 0} LP</span>
                </div>
                <div class="player-stats">
                    ${p.recentGames?.length || 0}전 | ${Math.round((p.recentGames?.filter(g=>g.res==='승').length/p.recentGames?.length||0)*100)}%
                </div>
            </div>
        `).join('');

        const opts = '<option value="">선수 선택</option>' + players.map(p => `<option value="${p.id}">${p.name} (${p.groupRank}위)</option>`).join('');
        document.getElementById("challengerSelect").innerHTML = opts;
        document.getElementById("defenderSelect").innerHTML = opts;
    });

    // 경기 기록 (보상 시스템 통합)
    window.battleRecord = async () => {
        const cId = document.getElementById("challengerSelect").value;
        const dId = document.getElementById("defenderSelect").value;
        const res = document.getElementById("resSelect").value;
        const score = document.getElementById("scoreInput").value;

        if(!cId || !dId || cId === dId) return alert("선수를 선택해주세요.");

        const c = players.find(p => p.id === cId);
        const d = players.find(p => p.id === dId);
        const dt = new Date().toLocaleDateString('ko-KR').slice(2, -1);

        // 보상 계산 (승 30, 패 10)
        const cp = (c.points || 0) + (res === '승' ? 30 : 10);
        const dp = (d.points || 0) + (res === '승' ? 10 : 30);

        let upC = { points: cp, recentGames: [{res, opp: d.name, sc: score, dt}, ...(c.recentGames || [])].slice(0, 10) };
        let upD = { points: dp, recentGames: [{res: res==='승'?'패':'승', opp: c.name, sc: score, dt}, ...(d.recentGames || [])].slice(0, 10) };

        // 순위 교체 로직 유지
        if (res === '승' && Number(c.groupRank) > Number(d.groupRank)) {
            upC.groupRank = Number(d.groupRank);
            upD.groupRank = Number(c.groupRank);
        }

        upC.rankHistory = [...(c.rankHistory || []), upC.groupRank || c.groupRank].slice(-10);
        upD.rankHistory = [...(d.rankHistory || []), upD.groupRank || d.groupRank].slice(-10);

        await updateDoc(doc(db, "ranking", c.id), upC);
        await updateDoc(doc(db, "ranking", d.id), upD);
        alert("기록 완료 및 포인트 지급!");
    };

    // 상세 모달 (기존의 모든 분석 로직 복구)
    window.showLog = (id) => {
        const p = players.find(x => x.id === id);
        const achs = getAchievements(p);
        const analysis = getAnalysis(p);

        document.getElementById("modalBody").innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h2 style="margin:0;">${p.name} <span style="font-size:14px; color:var(--primary);">${getTier(p.points || 0)}</span></h2>
                <div style="text-align:right;"><b>${p.points || 0} LP</b></div>
            </div>
            <div style="margin-top:10px;">${achs.map(a => `<span class="badge">${a}</span>`).join('')}</div>
            <div class="mention-box">
                <h4 style="margin:0 0 8px 0; font-size:14px;">💡 분석 리포트</h4>
                ${analysis.map(m => `<div style="font-size:13px; margin-bottom:3px;">• ${m}</div>`).join('')}
            </div>
            <div style="font-size:12px; color:#a0aec0; margin-bottom:10px;">최근 10경기 히스토리</div>
            <div style="max-height:120px; overflow-y:auto;">
                ${(p.recentGames || []).map(g => `<div style="padding:5px 0; border-bottom:1px solid #eee; font-size:13px;">${g.dt} vs ${g.opp} (${g.res} / ${g.sc})</div>`).join('')}
            </div>
        `;

        document.getElementById("modalOverlay").style.display = "flex";
        
        const ctx = document.getElementById('rankChart').getContext('2d');
        if (myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: (p.rankHistory || []).map((_, i) => i + 1),
                datasets: [{ label: '순위 변화', data: p.rankHistory || [], borderColor: '#3182ce', tension: 0.3 }]
            },
            options: { scales: { y: { reverse: true, ticks: { stepSize: 1 } } } }
        });
    };
</script>
</body>
</html>
