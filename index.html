<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>세화 스쿼시 실시간 랭킹</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #3182ce;
            --bg: #f7fafc;
            --card: #ffffff;
            --text: #2d3748;
        }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; line-height: 1.5; }
        .container { max-width: 500px; margin: 0 auto; }
        
        /* 카드 및 레이아웃 */
        .card { background: var(--card); border-radius: 15px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .rank-item { display: flex; align-items: center; padding: 12px; border-bottom: 1px solid #edf2f7; cursor: pointer; transition: 0.2s; }
        .rank-item:hover { background: #f1f5f9; }
        .rank-number { width: 30px; font-weight: bold; color: var(--primary); }
        .player-info { flex: 1; margin-left: 10px; }
        .player-name { font-weight: 600; font-size: 16px; }
        .player-tier { font-size: 11px; color: #718096; display: block; }
        .player-stats { font-size: 13px; color: #a0aec0; }

        /* 입력 폼 */
        .input-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        select, input { padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; }
        button { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; }

        /* 모달 스타일 */
        #modalOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); display:none; justify-content:center; align-items:center; z-index:1000; }
        .modal { background: white; width: 90%; max-width: 400px; border-radius: 20px; padding: 20px; max-height: 85vh; overflow-y: auto; }
        .badge-list { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0; }
        .badge { font-size: 11px; padding: 3px 8px; border-radius: 10px; background: #ebf8ff; color: #2b6cb0; border: 1px solid #bee3f8; }
        
        canvas { margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align: center; margin-bottom: 25px;">🏸 SEWHA RANKING</h2>

    <div class="card">
        <div class="input-group">
            <select id="challengerSelect"><option value="">도전자 선택</option></select>
            <select id="defenderSelect"><option value="">방어자 선택</option></select>
        </div>
        <div class="input-group">
            <input type="text" id="scoreInput" placeholder="스코어 (예: 2:1)">
            <select id="resultSelect">
                <option value="승">도전자 승리</option>
                <option value="패">도전자 패배</option>
            </select>
        </div>
        <button onclick="battleRecord()">경기 결과 확정</button>
    </div>

    <div class="card" id="rankList">
        <p style="text-align: center; color: #a0aec0;">데이터를 불러오는 중...</p>
    </div>
</div>

<div id="modalOverlay" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
        <div id="modalBody"></div>
        <canvas id="rankChart"></canvas>
        <button onclick="closeModal()" style="margin-top:20px; background:#edf2f7; color:#4a5568;">닫기</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Firebase 설정 (사용자님의 설정값 유지)
    const firebaseConfig = { /* 사용자님의 Firebase 설정을 여기에 넣어주세요 */ };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let players = [];
    let myChart = null;

    // --- [기능 1] 보상 시스템: 티어 정의 ---
    const TIERS = [
        { name: '💎 다이아몬드', min: 2000 },
        { name: '🏆 플래티넘', min: 1000 },
        { name: '🥇 골드', min: 500 },
        { name: '🥈 실버', min: 200 },
        { name: '🥉 브론즈', min: 0 }
    ];
    const getTier = (pts = 0) => TIERS.find(t => pts >= t.min).name;

    // --- [기능 2] 기존 기능: 실시간 데이터 구독 ---
    onSnapshot(query(collection(db, "ranking"), orderBy("groupRank", "asc")), (snap) => {
        players = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderRank();
        updateSelects();
    });

    function renderRank() {
        const list = document.getElementById("rankList");
        list.innerHTML = players.map((p, i) => {
            const winRate = p.recentGames?.length ? Math.round((p.recentGames.filter(g => g.res === '승').length / p.recentGames.length) * 100) : 0;
            return `
                <div class="rank-item" onclick="showLog('${p.id}')">
                    <div class="rank-number">${p.groupRank}</div>
                    <div class="player-info">
                        <span class="player-name">${p.name}</span>
                        <span class="player-tier">${getTier(p.points || 0)} | ${p.points || 0} LP</span>
                    </div>
                    <div class="player-stats">${winRate}% (${(p.recentGames || []).length}전)</div>
                </div>
            `;
        }).join('');
    }

    function updateSelects() {
        const options = '<option value="">선택</option>' + players.map(p => `<option value="${p.id}">${p.name} (${p.groupRank}위)</option>`).join('');
        document.getElementById("challengerSelect").innerHTML = options;
        document.getElementById("defenderSelect").innerHTML = options;
    }

    // --- [기능 3] 보상 시스템이 추가된 경기 기록 로직 ---
    window.battleRecord = async () => {
        const cId = document.getElementById("challengerSelect").value;
        const dId = document.getElementById("defenderSelect").value;
        const score = document.getElementById("scoreInput").value;
        const res = document.getElementById("resultSelect").value;

        if(!cId || !dId || cId === dId) return alert("선수를 정확히 선택해주세요.");

        const c = players.find(p => p.id === cId);
        const d = players.find(p => p.id === dId);
        const dt = new Date().toLocaleDateString('ko-KR').slice(2, -1);

        // 보상 포인트 계산 (승리 30, 패배 10)
        const cPoints = (c.points || 0) + (res === '승' ? 30 : 10);
        const dPoints = (d.points || 0) + (res === '승' ? 10 : 30);

        let updateC = { 
            points: cPoints,
            recentGames: [{res, opp: d.name, sc: score, dt}, ...(c.recentGames || [])].slice(0, 10) 
        };
        let updateD = { 
            points: dPoints,
            recentGames: [{res: res==='승'?'패':'승', opp: c.name, sc: score, dt}, ...(d.recentGames || [])].slice(0, 10) 
        };

        // 기존 랭킹 교체 로직 유지
        if (res === '승' && Number(c.groupRank) > Number(d.groupRank)) {
            updateC.groupRank = Number(d.groupRank);
            updateD.groupRank = Number(c.groupRank);
        }

        updateC.rankHistory = [...(c.rankHistory || []), updateC.groupRank || c.groupRank].slice(-10);
        updateD.rankHistory = [...(d.rankHistory || []), updateD.groupRank || d.groupRank].slice(-10);

        await updateDoc(doc(db, "ranking", c.id), updateC);
        await updateDoc(doc(db, "ranking", d.id), updateD);
        alert(`결과 반영 완료! (+${res === '승' ? '30' : '10'} LP)`);
    };

    // --- [기능 4] 기존 로직: 상성 분석 및 업적/멘트 (그대로 유지) ---
    window.showLog = (id) => {
        const p = players.find(x => x.id === id);
        const matchups = {};
        (p.recentGames || []).forEach(g => {
            if(!matchups[g.opp]) matchups[g.opp] = {w:0, t:0};
            matchups[g.opp].t++;
            if(g.res === '승') matchups[g.opp].w++;
        });

        const tier = getTier(p.points || 0);
        
        document.getElementById("modalBody").innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:flex-end;">
                <div>
                    <span style="font-size:12px; color:#3182ce; font-weight:bold;">${tier}</span>
                    <h2 style="margin:0;">${p.name}</h2>
                </div>
                <div style="text-align:right;">
                    <div style="font-size:18px; font-weight:bold; color:#2d3748;">${p.points || 0} <small>LP</small></div>
                    <div style="font-size:12px; color:#a0aec0;">현재 순위: ${p.groupRank}위</div>
                </div>
            </div>
            
            <div class="badge-list">
                ${(p.recentGames || []).filter(g => g.res === '승').length >= 3 ? '<span class="badge">🔥 3연승 중</span>' : ''}
                <span class="badge">🏅 성실파</span>
            </div>

            <div style="background:#f8fafc; padding:15px; border-radius:12px; margin-top:15px;">
                <h4 style="margin:0 0 10px 0; font-size:14px;">🎯 라이벌 분석</h4>
                ${Object.entries(matchups).map(([name, s]) => `
                    <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:5px;">
                        <span>vs ${name}</span>
                        <b>${s.w}승 ${s.t - s.w}패</b>
                    </div>
                `).join('') || '<div style="font-size:12px; color:#a0aec0;">기록된 상대가 없습니다.</div>'}
            </div>
        `;

        renderChart(p);
        document.getElementById("modalOverlay").style.display = "flex";
    };

    function renderChart(p) {
        const ctx = document.getElementById('rankChart').getContext('2d');
        if (myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: (p.rankHistory || []).map((_, i) => i + 1),
                datasets: [{
                    label: '랭킹 변화',
                    data: p.rankHistory || [],
                    borderColor: '#3182ce',
                    tension: 0.3,
                    fill: false
                }]
            },
            options: {
                scales: { y: { reverse: true, ticks: { stepSize: 1 } } },
                plugins: { legend: { display: false } }
            }
        });
    }

    window.closeModal = () => document.getElementById("modalOverlay").style.display = "none";

</script>
</body>
</html>
